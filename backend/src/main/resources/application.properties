spring.application.name=smart-panchayat
server.port=${PORT:8080}

# Default: embedded H2 file DB (works with zero setup).
# For MySQL set: DB_URL=jdbc:mysql://localhost:3306/panchayat DB_USER=root DB_PASSWORD=... DB_DRIVER=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/panchayat;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Comma separated list of allowed frontend origins (* = all)
app.cors.allowed-origins=${CORS_ORIGINS:*}

# AI assistant (Claude API). Key comes from environment variable, never commit it.
ai.api-key=${ANTHROPIC_API_KEY:}
ai.model=${AI_MODEL:claude-sonnet-5-5}

# H2 web console to view saved users: http://localhost:8080/h2-console (off unless H2_CONSOLE=true)
spring.h2.console.enabled=${H2_CONSOLE:false}
